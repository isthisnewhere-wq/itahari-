name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Build jobs cannot publish or write to the repository.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Read GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v5

      # The existing generator has no packages to install.
      # Use Pages metadata for user sites, project sites, and custom domains.
      - name: Build and validate the website in a temporary copy
        id: website
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node itahari/scripts/build-pages.mjs

      - name: Upload built website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.website.outputs.artifact_path }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
